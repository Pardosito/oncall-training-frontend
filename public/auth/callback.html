<!doctype html>
<!--
  Cognito bounce page (DECISIONS D-25). Cognito only accepts HTTPS callback URLs, but the S3
  website endpoint that serves the SPA is HTTP. This page is opened on the bucket's HTTPS REST
  endpoint (https://<bucket>.s3.us-east-1.amazonaws.com/auth/callback.html) and forwards the
  code and state, unchanged, to the SPA's /callback on the website endpoint.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing in…</title>
  </head>
  <body>
    <p>Signing you in…</p>
    <script>
      (function () {
        var host = location.hostname;
        var bucket = host.split(".s3.")[0];
        var site =
          host.indexOf(".s3.") > 0
            ? "http://" + bucket + ".s3-website-us-east-1.amazonaws.com"
            : location.origin;
        location.replace(site + "/callback" + location.search);
      })();
    </script>
  </body>
</html>
